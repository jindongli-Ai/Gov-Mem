project:
  name: Gov-Mem-v8-Late-Governance-dev1
  seed: 42

experiment:
  mode: govmem_v8_dev1_late_governance

llm:
  provider: openlux
  api_key_env: OPENLUX_API_KEY
  api_base: https://api.openlux.ai/v1
  base_model: gemini-2.5-flash-lite
  role_models: {}
  memory_ingestion_model: gemini-2.5-flash-lite
  query_planner_model: gemini-2.5-flash-lite
  reasoning_model: gemini-2.5-flash-lite
  answering_model: gemini-2.5-flash-lite
  temperature: 0.0
  max_output_tokens: 4096
  max_retries: 2
  json_max_attempts: 1
  request_timeout: 120
  retry_backoff_seconds: 3.0
  max_retry_backoff_seconds: 20.0
  allow_fallback: false

embedding:
  provider: openlux
  api_key_env: OPENLUX_API_KEY
  api_base: https://api.openlux.ai/v1
  model: text-embedding-3-small
  request_timeout: 90
  retry_backoff_seconds: 3.0
  max_retry_backoff_seconds: 20.0
  cache_dir: cache/embeddings/govmem_v8_dev1_text_embedding_3_small
  allow_fallback: false

rag:
  naive_top_k: 20

v8_extraction:
  max_new_turns_per_call: 32
  context_turns: 8
  inline_max_new_turns: 64
  inline_max_chars: 24000
  max_prefill_calls: 4

v8_query:
  max_candidate_chars: 0  # Preserve full retrieved turns; no silent truncation
  max_adjacent_context: 12

stage2:
  long_context_field_ledger:
    enabled: false

pipeline:
  fail_fast: true
  use_asking_user_id: true
  save_intermediate: true

self_evolving:
  enable_experience: false
  enable_skill_update: false
  update_every_n_failures: 20

evaluation:
  clean_benchmark: true
  allow_gold_feedback: false
  protocol: gatemem_paper_main
  official_judge:
    enabled: true
    provider: openlux
    api_base: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    model: gpt-4o
    temperature: 0.0
    max_output_tokens: 4096
    concurrency: 20
    gate_by_action: false

runner:
  dataset_name: checkpoint_benchmark
  data_root: dataset/GateMem/gatemem/data
  stage: all
  experiment_mode: govmem_v8_dev1_late_governance
