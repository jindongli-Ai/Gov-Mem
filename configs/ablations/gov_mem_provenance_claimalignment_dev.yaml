      use_governed_graph: true
      use_dual_channel_retrieval: true
      enable_graph_typed_slot_realization: false
      governance_runtime:
        use_llm_policy_frame_compiler: true
  - name: no_policy_frame_compiler
    label: w/o Cited Policy-Frame Compiler
    overrides:
      use_governed_graph: true
      use_dual_channel_retrieval: true
