# Official GateMem Naive RAG, independently reproduced for the unified
# OpenLux/gpt-5.4-nano comparison. No Gov-Mem symbolic or Stage-2 component.
out_dir: outputs/rag_naive_gpt54nano_full2218_20260921
agent: rag_naive

llm_provider: openlux
llm_model: gpt-5.4-nano
temperature: 0.0
max_output_tokens: 4096
timeout_s: 120
max_retries: 3
api_base: https://api.openlux.ai/v1
api_key_env: OPENLUX_API_KEY
api_keys_env: OPENLUX_API_KEYS

retrieval_backend: embedding
embedding_impl: native
embed_provider: openai
