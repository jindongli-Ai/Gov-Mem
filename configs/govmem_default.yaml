project:
  name: Gov-Mem
  seed: 42

experiment:
  # Paper-facing Gov-Mem pipeline: RAG + semantic compiler + symbolic
  # temporal authorization + Stage-2 governed reranking.
  mode: govmem_v4_symbolic

llm:
  provider: openlux
  api_key_env: OPENLUX_API_KEY
  api_base: https://api.openlux.ai/v1
  base_model: gemini-2.5-flash-lite
  role_models: {}
  memory_ingestion_model: gemini-2.5-flash-lite
  query_planner_model: gemini-2.5-flash-lite
  answering_model: gemini-2.5-flash-lite
  temperature: 0.0
  max_retries: 6
  request_timeout: 180
  retry_backoff_seconds: 3.0
  max_retry_backoff_seconds: 30.0
  allow_fallback: true

embedding:
  provider: yunwu
  api_key_env: YUNWU_API_KEY
  api_base: https://yunwu.ai/v1
  model: text-embedding-3-large
  request_timeout: 180
  retry_backoff_seconds: 3.0
  max_retry_backoff_seconds: 30.0
  cache_dir: cache/embeddings
  allow_fallback: true

memory:
  enable_forgetting: true
  enable_privacy_filter: true

retrieval:
  dense_top_k: 20
  symbolic_top_k: 20
  final_top_k: 8

rag:
  chunk_top_k: 30
  final_context_k: 12
  include_sliding_windows: true
  include_speaker_windows: true

reasoning:
  max_selected_frames: 12
  min_slot_coverage: 0.70
  preserve_complementary_evidence: true

rendering:
  prefer_surface_spans: true
  include_canceled_items: true
  include_conditions: true
  allow_redundant_utility_slots: true
  max_answer_sentences: 8

utility_realization:
  mode: v11_surface_replay
  enable_need_spec: true
  enable_utility_records: true
  enable_need_aware_packing: true
  enable_canonical_renderer: true
  enable_coverage_minimality_verifier: true
  fallback_to_v11_renderer: true

governance_runtime:
  enable_evidence_frame_compiler: true
  enable_current_state_ledger: true
  enable_slot_coverage_selection: true
  enable_deterministic_renderer: true
  enable_slot_level_access: true
  preserve_surface_spans: true
  allow_runtime_gold_fields: false
  use_llm_frame_normalizer: true

symbolic:
  temporal_authorization:
    enabled: true
    enforcement: true

semantic_compiler:
  enabled: true
  query_induction:
    enabled: true
  atom_extraction:
    enabled: true
    high_recall: true
  grounding_verification:
    enabled: true
  coverage:
    enabled: true
  repair:
    enabled: true
    max_rounds: 1

# Auxiliary Entity Relation List / Memory Governed Slot Graph. Disabled in
# the paper-facing main path; enable only for its explicit ablation.
memory_governed_slot_graph:
  enabled: false
  batch_size: 8
  dense_index: false

stage2:
  query_analysis:
    enabled: true
  llm_reasoning_rerank:
    enabled: true
    max_candidates: 20
    max_candidate_chars: 2400

pipeline:
  use_asking_user_id: true
  save_intermediate: true

self_evolving:
  enable_experience: true
  enable_skill_update: false
  update_every_n_failures: 20

ablation:
  use_dense_retrieval: true
  use_symbolic_retrieval: true
  use_query_planner: true
  use_logical_reasoning: true
  use_privacy_filter: true
  use_forgetting: true
  use_action_predictor: true
  use_experience: false
  use_current_state_ledger: true
  use_slot_coverage_selection: true
  use_deterministic_renderer: true
  use_slot_level_access: true

evaluation:
  metrics:
    - accuracy
    - exact_match
    - format_error_rate
