project:
  name: Gov-Mem
  seed: 42

experiment:
  mode: rag_naive_v3_typed_rerank

llm:
  provider: jellyfishp
  api_key_env: JELLYFISHP_API_KEY
  api_base: https://newapi.medu.chat/v1
  base_model: gemini-3-flash
  role_models: {}
  memory_ingestion_model: gemini-3-flash
  query_planning_model: gemini-3-flash
  answering_model: gemini-3-flash
  temperature: 0.2
  max_retries: 3
  request_timeout: 120
  retry_backoff_seconds: 5.0
  max_retry_backoff_seconds: 30.0
  allow_fallback: false

embedding:
  provider: jellyfishp
  api_key_env: JELLYFISHP_API_KEY
  api_base: https://newapi.medu.chat/v1
  model: qwen3-embedding-0.6b
  request_timeout: 60
  retry_backoff_seconds: 5.0
  max_retry_backoff_seconds: 30.0
  cache_dir: cache/embeddings/rag_naive_v3_jellyfishp_gemini_fresh
  allow_fallback: false

pipeline:
  use_asking_user_id: true
  save_intermediate: true

memory:
  enable_forgetting: true
  enable_privacy_filter: true

ablation:
  use_query_planner: true
  use_logical_reasoning: true
  use_action_predictor: true

self_evolving:
  enable_experience: true
  enable_skill_update: false
  update_every_n_failures: 20

rag:
  naive_top_k: 20

stage2:
  llm_reasoning_rerank:
    enabled: true
    max_candidates: 20
    max_candidate_chars: 2400
  long_context_field_ledger:
    enabled: true
    max_context_chars: 120000

evaluation:
  official_judge:
    enabled: true
    provider: yunwu
    api_base: https://newapi.medu.chat/v1
    api_key_env: JELLYFISHP_API_KEY
    model: gpt-4o
    temperature: 0.0
    max_output_tokens: 4096
    concurrency: 1

runner:
  dataset_name: checkpoint_benchmark
  data_root: dataset/GateMem/gatemem/data
  stage: all
  experiment_mode: rag_naive_v3_typed_rerank
